name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - run: uv sync
      - run: uv run pytest
