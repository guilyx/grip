{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set card = config.site_url ~ "assets/brand/og-card.png" %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{% if page and page.title and not page.is_homepage %}{{ page.title }} · {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ card }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  {% if page and page.canonical_url %}<meta property="og:url" content="{{ page.canonical_url }}">{% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ card }}">
  <meta name="theme-color" content="#1e1e1c">
{% endblock %}

{% block announce %}
  <strong>New</strong>&nbsp; grip now runs inside your coding agent.
  <a href="{{ 'agents/' | url }}">See how it works</a>
{% endblock %}
