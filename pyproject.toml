[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "grip-hook"
dynamic = ["version"]
description = "Keep a grip on your code: a git hook that quizzes you on your diff before you commit or push it."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Erwin L.", email = "erwin.lejeune15@gmail.com" }]
keywords = ["git", "hook", "pre-commit", "pre-push", "quiz", "llm", "code-review", "understanding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dependencies = [
  "anthropic>=1.0,<2",
  "click>=8.1",
  "pydantic>=2.5",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pre-commit>=3.7",
]
build = [
  "pyinstaller>=6.10",
]
demo = [
  "pyte>=0.8",
  "pillow>=10.0",
  "fonttools>=4.40",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.scripts]
grip = "grip_hook.cli:main"
git-grip = "grip_hook.cli:main"

[project.urls]
Homepage = "https://github.com/guilyx/grip"
Documentation = "https://guilyx.github.io/grip/"
Repository = "https://github.com/guilyx/grip"
Issues = "https://github.com/guilyx/grip/issues"
Changelog = "https://github.com/guilyx/grip/blob/main/CHANGELOG.md"
Releases = "https://github.com/guilyx/grip/releases"

[tool.hatch.version]
path = "src/grip_hook/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/grip_hook", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/grip_hook"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts/demo/fixture"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PT", "D"]
ignore = [
  "D100", "D104", "D105", "D107",  # module/package/magic-method docstrings
  "PLR0913",                        # too many arguments
  "PLR2004",                        # magic values in tests are fine
]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR", "S101", "PT018"]
"scripts/**" = ["PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:grip_hook.*"]

[tool.coverage.run]
source = ["grip_hook"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
