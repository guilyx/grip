name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-latest
          - target: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install --system -e ".[build]"
      - name: Check the tag matches the package version
        run: |
          version="$(python -m grip_hook --version | awk '{print $NF}')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: scripts/build/package.sh
      - name: Check the artifact name matches the target
        run: test -f "dist/grip-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: grip-${{ matrix.target }}
          path: |
            dist/grip-${{ matrix.target }}.tar.gz
            dist/grip-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble assets and checksums
        run: |
          mkdir -p release
          cp artifacts/*.tar.gz release/
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo 'curl -fsSL https://raw.githubusercontent.com/guilyx/grip/main/install.sh | sh'
            echo '```'
            echo
            echo "Pin this version with \`sh -s -- --version ${GITHUB_REF_NAME}\`. Checksums are in \`SHA256SUMS\`."
          } >> release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            release/*.tar.gz
            release/SHA256SUMS
