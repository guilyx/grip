name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/grip_hook/__init__.py)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - name: Smoke-test the wheel in a clean tool environment
        run: |
          uv tool install dist/*.whl
          export PATH="$(uv tool dir --bin):$PATH"
          grip --version
          cd "$(mktemp -d)" && git init -q && echo "x = 1" > a.py && git add a.py
          grip whiteboard --provider fake --export board.html
          grep -q '"mode": "export"' board.html
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this workflow (release.yml) for grip-hook, no token.
    environment:
      name: pypi
      url: https://pypi.org/project/grip-hook/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: Publish GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo "pipx install grip-hook==${version}    # or: uv tool install grip-hook==${version}"
            echo '```'
            echo
            echo "On PyPI: https://pypi.org/project/grip-hook/${version}/"
          } >> release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
